plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.wumisc.rgbbeat'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.wumisc.rgbbeat"
        minSdk 26          // Android 8.0+：Type.APPLICATION_OVERLAY 与前台服务需要
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // LSPosed 模块在 debug 下也建议禁用压缩，避免类名被混淆导致 Xposed 入口失效
    lint {
        abortOnError false
    }
}

dependencies {
    // LSPosed / Xposed API —— compileOnly：仅编译期引用，运行时由框架提供
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    // 单元测试（JVM + Robolectric）：稳定性回归
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}
